---
layout: default
---

{{ content }}

<h2>{{ page.list_title | default: "Posts" }}</h2>

<ul class="post-list">
  {%- for post in site.posts -%}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <small>{{ post.date | date: "%-d %b %Y" }}</small>
  </li>
  {%- endfor -%}
</ul>
